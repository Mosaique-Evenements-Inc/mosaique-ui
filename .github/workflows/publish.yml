name: Publish package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version approved for publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ui
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@mosaique-evenements-inc"
      - name: Verify approved version
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: node -e 'const p=require("./package.json"); if(p.version !== process.env.APPROVED_VERSION) throw new Error("Approved version must match package.json");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Refuse an already published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          gh api --paginate --slurp /orgs/Mosaique-Evenements-Inc/packages/npm/ui/versions > "$RUNNER_TEMP/ui-versions.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pages = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/ui-versions.json`, "utf8"));
            if (!Array.isArray(pages) || !pages.length || pages.some(page => !Array.isArray(page))) throw new Error("Invalid package history response");
            const versions = pages.flat();
            if (!versions.length || versions.some(version => typeof version.name !== "string")) throw new Error("Cannot establish existing package history");
            if (versions.some(version => version.name === process.env.APPROVED_VERSION)) throw new Error("Version already exists; never overwrite");
          '
      - name: Pack validated source
        run: pnpm pack --pack-destination "$RUNNER_TEMP/ui-package" --json
      - name: Inspect archive
        run: tar -tf "$RUNNER_TEMP/ui-package/mosaique-evenements-inc-ui-${APPROVED_VERSION}.tgz"
        env:
          APPROVED_VERSION: ${{ inputs.version }}
      - name: Publish inspected archive
        run: npm publish "$RUNNER_TEMP/ui-package/mosaique-evenements-inc-ui-${APPROVED_VERSION}.tgz" --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          APPROVED_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
